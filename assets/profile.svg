<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 820" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#010108"/>
      <stop offset="40%" stop-color="#050510"/>
      <stop offset="100%" stop-color="#0a0a18"/>
    </linearGradient>
    <radialGradient id="moonFace" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fffff8"/>
      <stop offset="55%" stop-color="#ece8d5"/>
      <stop offset="100%" stop-color="#c5c0a5"/>
    </radialGradient>
    <radialGradient id="innerHalo" cx="50%" cy="50%" r="50%">
      <stop offset="40%" stop-color="#fffff835"/>
      <stop offset="100%" stop-color="#fffff800"/>
    </radialGradient>
    <radialGradient id="outerHalo" cx="50%" cy="50%" r="50%">
      <stop offset="20%" stop-color="#fffff812"/>
      <stop offset="100%" stop-color="#fffff800"/>
    </radialGradient>
    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffff808"/>
      <stop offset="100%" stop-color="#fffff800"/>
    </radialGradient>
    <filter id="moonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="starGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="0.5"/>
    </filter>
    <path id="batPath" d="M-60,130 Q200,80 400,140 Q550,180 860,120"/>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#sky)"/>
  <circle cx="200" cy="200" r="200" fill="url(#ambientGlow)"/>

